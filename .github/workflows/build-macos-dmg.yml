name: Build macOS DMG

on:
  push:
    branches:
      - arena/4356cc8e-clippy
    paths:
      - app.py
      - Clippy.spec
      - icon.JPG
      - uninstall.command
      - scripts/build_macos_dmg.sh
      - .github/workflows/build-macos-dmg.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Apple Silicon installer
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyInstaller "PySide6==6.11.2" "pynput==1.8.1"

      - name: Build app and DMG
        run: bash scripts/build_macos_dmg.sh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: clippy-macos-arm64-dmg
          path: dist/Clippy.dmg
          if-no-files-found: error
          retention-days: 7
