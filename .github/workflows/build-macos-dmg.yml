name: Build macOS DMG

on:
  push:
    branches:
      - arena/4356cc8e-clippy
    paths:
      - app.py
      - Clippy.spec
      - icon.JPG
      - uninstall.command
      - scripts/build_macos_dmg.sh
      - .github/workflows/build-macos-dmg.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Apple Silicon installer
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyInstaller "PySide6==6.11.2" "pynput==1.8.1"

      - name: Build app and DMG
        run: bash scripts/build_macos_dmg.sh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: clippy-macos-arm64-dmg
          path: dist/Clippy.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          subject="$(git log -1 --format=%s)"
          if [[ "$subject" =~ ^release:\ publish\ Clippy\ v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "Commit subject must be 'release: publish Clippy vX.Y.Z'." >&2
            exit 1
          fi

          notes_file="release-notes/${version}.md"
          if [[ ! -f "$notes_file" ]]; then
            echo "Release notes not found: $notes_file" >&2
            exit 1
          fi

          gh release create "$version" dist/Clippy.dmg \
            --repo mr-stepler/Clippy \
            --target "$GITHUB_SHA" \
            --title "Clippy v$version" \
            --notes-file "$notes_file"
